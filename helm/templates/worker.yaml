apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipwave-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipwave-worker
  template:
    metadata:
      labels:
        app: shipwave-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
