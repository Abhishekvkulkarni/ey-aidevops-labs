name: ci

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API requirements
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt

      - name: Lint API
        run: python -m compileall api/app

  test:
    name: test
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API requirements
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt pytest httpx

      - name: Run tests
        working-directory: api
        run: python -m pytest tests

  build:
    name: build
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_TOKEN }}

      - name: Build and push API image
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/${{ vars.NAMESPACE }}/api:${{ github.sha }}"
          docker build -t "$IMAGE" api/
          docker push "$IMAGE"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Decode kubeconfig
        run: |
          printf '%s' '${{ secrets.KUBECONFIG_B64 }}' | base64 --decode > kubeconfig
          chmod 600 kubeconfig

      - name: Deploy with Helm
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          helm upgrade --install shipwave-api helm/ \
            --namespace "${{ vars.NAMESPACE }}" \
            --set image.repository="${{ vars.ACR_LOGIN_SERVER }}/${{ vars.NAMESPACE }}/api" \
            --set image.tag="${{ github.sha }}"
